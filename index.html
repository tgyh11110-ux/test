<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>민원서비스 빠른찾기</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hero">
    <div class="container">
      <p class="eyebrow">민원서비스 안내</p>
      <h1>원하는 민원서비스를 빠르게 찾아보세요</h1>
      <p class="subtitle">서비스명을 검색하거나 민원분야를 선택하면 조건에 맞는 서비스를 바로 확인할 수 있습니다.</p>
    </div>
  </header>

  <main class="container">
    <section class="search-panel" aria-label="민원서비스 검색">
      <div class="field search-field">
        <label for="keyword">서비스명 검색</label>
        <div class="input-wrap">
          <span aria-hidden="true">⌕</span>
          <input id="keyword" type="search" placeholder="예: 주민등록, 여권, 연금" autocomplete="off">
        </div>
      </div>

      <div class="field">
        <label for="category">민원분야</label>
        <select id="category">
          <option value="">전체 분야</option>
        </select>
      </div>

      <button id="resetBtn" type="button">검색 초기화</button>
    </section>

    <section class="result-head" aria-live="polite">
      <div>
        <h2>민원서비스 목록</h2>
        <p>현재 <strong id="resultCount">0</strong>건 표시 중</p>
      </div>
      <span id="filterStatus" class="status-badge">전체</span>
    </section>

    <section class="table-card">
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>서비스명</th>
              <th>소관기관</th>
              <th>민원분야</th>
              <th>온라인처리</th>
              <th>처리기한</th>
              <th>수수료</th>
            </tr>
          </thead>
          <tbody id="serviceTableBody"></tbody>
        </table>
      </div>
      <div id="emptyState" class="empty-state" hidden>
        <div class="empty-icon">⌕</div>
        <strong>검색 결과가 없습니다.</strong>
        <p>검색어 또는 민원분야를 변경해 주세요.</p>
      </div>
    </section>
  </main>

  <footer>
    <div class="container">민원서비스 빠른찾기 · 첨부 JSON 데이터 기반</div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
